name: Stacked PR Tree

on:
  pull_request:
    branches:
      - '**'

jobs:
  stacked-pr:
    name: Display the branch stack
    runs-on: ubuntu-latest

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
      - uses: git-town/action@v1
        with:
          skip-single-stacks: true
